[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "abizon-backend"
version = "0.1.0"
description = "Abizon backend service: storage signing, background jobs, Claude on Bedrock."
requires-python = ">=3.13"
# Exact pins. Resolved together on 15 Sep 2026; celery[redis] 5.6.3 needs redis<7,
# which is why redis is 6.4 and not the newest release.
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.53.0",
  "sqlalchemy[asyncio]==2.0.53",
  "asyncpg==0.31.0",
  "alembic==1.20.0",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  "celery[redis]==5.6.3",
  "redis==6.4.0",
  "boto3==1.43.94",
  "anthropic[bedrock]==1.5.0",
  "pyjwt==2.14.0",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "aiosqlite==0.22.1",
  "moto[s3]==5.2.3",
  "fakeredis==2.38.0",
  "ruff==0.16.7",
  "mypy==2.3.1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "SIM", "RUF"]
ignore = [
  "RUF012",  # mutable class attributes on exception classes are intentional constants
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]
