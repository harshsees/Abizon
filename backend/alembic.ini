# Alembic — migrations for the `svc` schema only.
#
#   alembic upgrade head                 apply
#   alembic upgrade head --sql           print the SQL without a database
#   alembic revision --autogenerate -m   draft a migration from the models
#
# The database URL comes from DATABASE_URL via app.core.config, not from here,
# so there is one place it is set and it is never committed.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
